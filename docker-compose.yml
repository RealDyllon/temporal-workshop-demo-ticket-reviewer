services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal_workshop
      POSTGRES_PASSWORD: temporal_workshop
      POSTGRES_DB: temporal_workshop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal_workshop -d temporal_workshop"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - temporal-workshop-postgres:/var/lib/postgresql/data

volumes:
  temporal-workshop-postgres:
